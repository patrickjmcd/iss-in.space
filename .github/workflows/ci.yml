name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  test:
    uses: patrickjmcd/workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "22"

  # Manifest mode: release-please-config.json + .release-please-manifest.json.
  release:
    if: github.event_name == 'push'
    needs: test
    uses: patrickjmcd/workflows/.github/workflows/release-please.yml@v1

  # main + short-SHA on every push. On a release: v1.2.3 (the tag k8s-argo
  # pins), 1.2.3, 1.2 and latest.
  image:
    if: github.event_name == 'push'
    needs: release
    uses: patrickjmcd/workflows/.github/workflows/docker-image.yml@v1
    with:
      version: ${{ needs.release.outputs.release_created == 'true' && needs.release.outputs.tag_name || '' }}
      tags: |
        type=raw,value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
